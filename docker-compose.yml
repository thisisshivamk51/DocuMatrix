version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docpass}
      POSTGRES_DB: ${POSTGRES_DB:-docdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./uploads:/uploads
      - ./samples:/samples
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  streamlit:
    build:
      context: .
      dockerfile: frontend/Dockerfile.streamlit
    environment:
      - API_BASE=http://backend:8000/api/v1
    env_file:
      - .env
    volumes:
      - ./:/app
      - ./uploads:/uploads
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  pgdata:
